[package]
name = "battlechan"
version = "0.1.0"
description = "BattleChan - time-boxed, token-curated social boards on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "battlechan"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
anchor-debug = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = "0.31.1"
